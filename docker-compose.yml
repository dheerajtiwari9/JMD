services:
  postgres:
    image: postgres:16-alpine
    container_name: mindmaped-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mindmaped
      POSTGRES_USER: mindmaped
      POSTGRES_PASSWORD: mindmaped_dev_only
    ports:
      - "5432:5432"
    volumes:
      - mindmaped-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindmaped -d mindmaped"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mindmaped-postgres-data:
